name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
          POSTGRES_DB: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://freight:freight@localhost:5432/freight
      OPERATOR_FORCE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate docker compose
        run: docker compose config
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
