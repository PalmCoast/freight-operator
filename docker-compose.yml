# Local Postgres with pgvector. Credentials match the default DATABASE_URL.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freight
    ports:
      - "5432:5432"
    volumes:
      - freight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  freight_pg:
